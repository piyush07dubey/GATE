services:
  api:
    build: .
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=mongodb://mongo:27017
      - MONGO_DB=gate_cse
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - RATE_LIMIT_DEFAULT=100/minute
      - APP_NAME=GATE CSE API
      - APP_VERSION=1.0.0
      - DEBUG=True
    depends_on:
      mongo:
        condition: service_healthy
    command: uvicorn standalone_main:app --host 0.0.0.0 --port 8001 --reload

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
